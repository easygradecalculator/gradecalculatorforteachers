<div class="card">

<div class="tabs">
<button class="tab-btn active" onclick="showTab('questions')">By Questions</button>
<button class="tab-btn" onclick="showTab('marks')">By Marks</button>
</div>

<div id="questions" class="tab-content">

<div class="input-group">
<label>Total Questions</label>
<input type="number" id="totalQuestions">
</div>

<div class="input-group">
<label>Wrong Answers</label>
<input type="number" id="wrongAnswers">
</div>

<button class="calculate" onclick="calculateQuestions()">Calculate Grade</button>

<div id="resultQuestions" class="result"></div>

</div>

<div id="marks" class="tab-content" style="display:none;">

<div class="input-group">
<label>Total Marks</label>
<input type="number" id="totalMarks">
</div>

<div class="input-group">
<label>Obtained Marks</label>
<input type="number" id="obtainedMarks">
</div>

<button class="calculate" onclick="calculateMarks()">Calculate Percentage</button>

<div id="resultMarks" class="result"></div>

</div>

</div>
